# Runs the implementations a change touches in the TogetherThon's
# environment, and checks the files they write against their stages'
# contracts. A pull request from a fork must change one team's folder alone.
name: Pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # As root: the image's own user cannot write the runner's files.
    container:
      image: ghcr.io/mcencini/mritogetherthon:latest
      options: --user root
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find the implementations the change touches
        id: scope
        env:
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository && github.event_name == 'pull_request' }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git rev-list --max-parents=0 HEAD | tail -n 1)
          fi
          python -m pipeline scope --base "$BASE" $([ "$FORK" = true ] && echo --fork) > touched.txt
          echo "Implementations to check:"; cat touched.txt
          echo "implementations=$(tr '\n' ' ' < touched.txt)" >> "$GITHUB_OUTPUT"
      - name: Check them
        if: steps.scope.outputs.implementations != ''
        run: python -m pipeline check ${{ steps.scope.outputs.implementations }}
      - name: Run the pipeline
        if: github.event_name != 'pull_request'
        run: |
          if python -m pipeline run; then
            python -m pipeline compare
          fi
